<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chess Opening RNG</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Chess500</h1>

        <p class="subtitle">
            Try new oepnings
            Experience new challenges
            Explore diffrent playstyles
        </p>

        <!-- Side Selection -->

        <div class="selection">

            <h2>Choose a Side</h2>

            <label>
                <input type="radio" name="side" value="White" checked>
                White
            </label>

            <label>
                <input type="radio" name="side" value="Black">
                Black
            </label>

            <label>
                <input type="radio" name="side" value="Both">
                Both
            </label>

        </div>

        <!-- Spin Button -->

        <button id="spinButton">

             🔁 SPIN 🔁

        </button>

        <!-- Result -->

        <div class="result">

            <h2 id="openingName">
                Press Spin!
            </h2>

            <p id="openingDescription">

                A description will appear here.

            </p>

            <h3 id="openingMessage">

                Your custom message goes here.

            </h3>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
